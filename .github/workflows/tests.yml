name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
        include:
          - os: macos-latest
            python-version: '3.14'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install package tools
        run: python -m pip install --upgrade pip build
      - name: Build and install distribution
        run: |
          python -m build
          python -m pip install dist/*.whl
          python -m pip check
      - name: Check installed CLI outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          explain-video --help
          python -m explain_video --help
      - name: Run offline tests against installed package
        run: |
          cd "$RUNNER_TEMP"
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
  setup:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Run setup with no preinstalled project environment
        run: ./setup.sh
      - name: Verify repeat setup preserves config and environment
        run: |
          printf '\n# Keep my settings\n' >> .env
          cp .env "$RUNNER_TEMP/expected.env"
          printf 'keep\n' > .venv/setup-preservation-marker
          ./setup.sh
          cmp .env "$RUNNER_TEMP/expected.env"
          test -f .venv/setup-preservation-marker
      - name: Check private config permissions and launcher from another directory
        run: |
          .venv/bin/python -c 'import stat; from pathlib import Path; assert stat.S_IMODE(Path(".env").stat().st_mode) == 0o600'
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/run" --help
      - name: Test setup environment without paid calls
        run: |
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.venv/bin/python" -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
