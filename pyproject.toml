[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "explain-video"
version = "0.2.1"
description = "Turn a Russian screen explanation into a simply narrated demo"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "edge-tts>=7,<8"]

[project.urls]
Repository = "https://github.com/peace-for-all/explain-blyat"
Issues = "https://github.com/peace-for-all/explain-blyat/issues"

[project.scripts]
explain-video = "explain_video.__main__:main"

[tool.setuptools.packages.find]
include = ["explain_video*"]
